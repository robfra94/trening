<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#122235">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trening A/B">
  <meta name="description" content="Dziennik treningowy A/B z importem i eksportem Excel">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Trening A/B</title>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="logo">A<span>/</span>B</div>
      <div class="brand"><strong>TRENING A/B</strong><small>SIŁA · PROGRES · SIATKÓWKA</small></div>
      <span class="saved" id="savedLabel">● Zapis lokalny</span>
    </header>
    <main id="app"></main>
    <nav class="bottom-nav" aria-label="Menu aplikacji">
      <button data-nav="home" class="active"><span>⌂</span>Start</button>
      <button data-nav="workout"><span>▣</span>Trening</button>
      <button data-nav="history"><span>◷</span>Historia</button>
      <button data-nav="plan"><span>☷</span>Plan</button>
      <button data-nav="data"><span>⇅</span>Excel</button>
    </nav>
  </div>
  <input type="file" id="importFile" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="jszip.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
